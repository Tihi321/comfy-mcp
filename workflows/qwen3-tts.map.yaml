# Mapping for qwen3-tts.json (TTS Audio Suite: Qwen3TTSEngineNode -> Unified TTS Text -> SaveAudioMP3).
kind: audio
text: { node: "4", input: text }
seed: { node: "4", input: seed }
# The voice reference clip: uploaded to ComfyUI's input folder and set on the LoadAudio node. Without voice_ref the node is dropped
# and the Character Voices library voice below is used.
voiceRef: { node: "2", input: audio }
# The exact words spoken in the voice reference clip.
voiceText: { node: "3", input: reference_text }
output: "5"
defaultVoice: voices_examples/female/female_01.wav
language: { node: "1", input: language }
languages:
  en: English
  zh: Chinese
  ja: Japanese
  ko: Korean
  de: German
  fr: French
  ru: Russian
  pt: Portuguese
  es: Spanish
  it: Italian
